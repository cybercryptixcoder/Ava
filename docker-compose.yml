# Production: Ava behind a Cloudflare Tunnel, with nothing exposed to the internet directly.
#   cp .env.example .env    and fill in at least AVA_PASSWORD_HASH, AVA_SESSION_SECRET,
#                           AVA_ENCRYPTION_KEY and PUBLIC_URL (your tunnel hostname)
#   docker compose --profile tunnel up -d
# Without --profile tunnel only Ava runs, reachable on this machine at http://127.0.0.1:4317.
services:
  ava:
    build: .
    image: ava:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4317"
      AVA_DATA_DIR: /data
    volumes:
      - ava-data:/data
    ports:
      - "127.0.0.1:4317:4317"

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # Cloudflare Zero Trust > Networks > Tunnels > your tunnel > token. Point its public hostname at http://ava:4317.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - ava

volumes:
  ava-data:
